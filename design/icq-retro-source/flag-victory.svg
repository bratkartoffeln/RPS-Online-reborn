<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <title>ICQ Retro – fröhliche Flaggeneroberer</title>
  <desc>Zwei frontale Siegerposen in lokalen 320 × 320-Koordinaten. Der blaue Sieger hält das blaue Tuch der roten Zielfigur, der rote Sieger das rote Tuch der blauen Zielfigur. Körperfarben und Kamerarichtung sind unabhängig. Alle Formen sind native Vektoren.</desc>
