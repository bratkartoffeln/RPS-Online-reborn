# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Bezahlte Compute-Instanz: Kosten vor dem ersten Deploy im Dashboard prüfen.
services:
  - type: web
    name: rps-arena
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: RECONNECT_SECONDS
        value: "120"
