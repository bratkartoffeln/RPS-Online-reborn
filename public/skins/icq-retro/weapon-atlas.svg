<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <title>ICQ Retro – Stein, Papier und Schere</title>
  <desc>Drei eigenständige Vektormotive mit transparentem Hintergrund. Jedes Motiv belegt ein 320 × 320 großes Feld. Keine eingebetteten Rasterbilder.</desc>
  <defs>
    <linearGradient id="stone-fill" x1=".18" y1="0" x2=".76" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#bcbdb8"/>
      <stop offset=".48" stop-color="#959692"/>
      <stop offset="1" stop-color="#6b6c69"/>
    </linearGradient>
    <linearGradient id="paper-fill" x1="0" y1="0" x2="1" y2=".18" gradientUnits="objectBoundingBox">
      <stop stop-color="#ddded7"/>
      <stop offset=".24" stop-color="#fffffb"/>
      <stop offset=".74" stop-color="#fffef6"/>
      <stop offset="1" stop-color="#e3e4dc"/>
    </linearGradient>
    <linearGradient id="blade-fill" x1="0" y1="0" x2="1" y2=".3" gradientUnits="objectBoundingBox">
      <stop stop-color="#d5d9d8"/>
      <stop offset=".42" stop-color="#fbfcf8"/>
      <stop offset="1" stop-color="#8c9495"/>
    </linearGradient>
    <linearGradient id="handle-fill" x1="0" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffe06d"/>
      <stop offset=".52" stop-color="#ffc327"/>
      <stop offset="1" stop-color="#e69d12"/>
    </linearGradient>
  </defs>
  <view id="rock" viewBox="0 0 320 320"/>
  <view id="paper" viewBox="320 0 320 320"/>
  <view id="scissors" viewBox="640 0 320 320"/>

