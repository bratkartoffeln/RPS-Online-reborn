<svg xmlns="http://www.w3.org/2000/svg" class="gong-scene" data-gong-style="arcade" data-animated="false" width="320" height="240" viewBox="0 0 320 240" aria-hidden="true"><style>.phase-referee, .phase-referee-turn { display: flex; align-items: center; justify-content: center; min-height: 135px; margin: 12px 0; line-height: 0; }
.referee-portrait { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; }
.gong-scene { display: block; max-width: 100%; flex-shrink: 0; overflow: visible; }
.gong-scene[data-animated="true"] .gong-mallet { will-change: transform; transform-box: view-box; animation: gong-strike 1500ms both; }
.gong-scene[data-animated="true"] .gong-disc { will-change: transform; animation: gong-ring 90ms linear 380ms infinite; transform-origin: 130px 115px; }
@keyframes gong-strike {
  0% { transform: rotate(0); animation-timing-function: cubic-bezier(.2,.65,.4,1); }
  10% { transform: rotate(9deg); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
  25.333% { transform: rotate(-73deg); animation-timing-function: cubic-bezier(.15,.6,.3,1); }
  59% { transform: rotate(5deg); animation-timing-function: cubic-bezier(.35,0,.3,1); }
  88%, 100% { transform: rotate(0); }
}
@keyframes gong-ring { 0%, 100% { transform: translateX(-2px) rotate(-.6deg); } 50% { transform: translateX(2px) rotate(.6deg); } }
:root[data-motion="off"] .gong-scene *, :root[data-motion="off"] .gong-scene *::before { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .gong-scene * { animation: none !important; } }
