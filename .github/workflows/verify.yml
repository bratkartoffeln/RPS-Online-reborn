name: Verify production container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rps-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev
      # Dockerbuild führt die Regeln-, Netzwerk- und Clienttests sowie tsc aus.
      # Danach prüft das Skript das gebaute Image mit echten Spielverbindungen.
      - run: npm run check:docker
